name: Production Smoke Check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for this commit to be live and healthy
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://aloyriinventory-vercel-crm.vercel.app/api/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null || true)"
            echo "Attempt $attempt: $body"
            if BODY="$body" EXPECTED_SHA="$EXPECTED_SHA" node -e '
              try {
                const body = JSON.parse(process.env.BODY || "{}");
                process.exit(body.status === "ok" && body.commit === process.env.EXPECTED_SHA && body.database?.status === "ok" && body.database?.relationalSchema === "ok" && body.database?.migrationVersion ? 0 : 1);
              } catch {
                process.exit(1);
              }
            '; then
              echo "Production code, database migrations and relational schema are healthy on commit $EXPECTED_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "Production did not become healthy on the expected commit in time."
          exit 1
