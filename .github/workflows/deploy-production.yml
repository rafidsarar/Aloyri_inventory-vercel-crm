name: Deploy Production

on:
  workflow_run:
    workflows: ["CRM CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_xBDKJzW8OQawZLacYAWSTBiU
      VERCEL_PROJECT_ID: prj_XXZPqcfajsE9Z7kzpIGC0pToirvm
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Vercel token
        run: test -n "$VERCEL_TOKEN"
      - name: Install Vercel CLI
        run: pnpm dlx vercel@latest --version
      - name: Pull production configuration
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production bundle
        run: pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production bundle
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
